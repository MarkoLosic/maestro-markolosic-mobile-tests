appId: ${BROWSER}
name: Home page loads with hero content
tags:
  - smoke
env:
  BROWSER: ${BROWSER || 'com.android.chrome'}
  URL: ${URL || 'https://markolosic.github.io'}
---
- runFlow:
    file: subflows/open_site.yaml
    env:
      BROWSER: ${BROWSER}
      URL: ${URL}
# On phones the hero headline sits below the photo and terminal card.
# scrollUntilVisible stops as soon as the element appears, so it can't
# overshoot the headline the way a fixed swipe loop does.
- scrollUntilVisible:
    element: ".*reliable.*"
    direction: DOWN
    timeout: 20000
- scrollUntilVisible:
    element: ".*Let.s talk.*"
    direction: DOWN
    timeout: 10000
- scrollUntilVisible:
    element: "Download CV"
    direction: DOWN
    timeout: 10000
- takeScreenshot: screenshots/01_home
