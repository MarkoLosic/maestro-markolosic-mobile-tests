appId: ${BROWSER}
name: Language switch EN -> SR -> EN
tags:
  - i18n
env:
  BROWSER: ${BROWSER || 'com.android.chrome'}
  URL: ${URL || 'https://markolosic.github.io'}
---
- runFlow:
    file: subflows/open_site.yaml
    env:
      BROWSER: ${BROWSER}
      URL: ${URL}
- tapOn: "Switch language"
- tapOn: "Menu"
- extendedWaitUntil:
    visible: "Kontakt"
    timeout: 10000
- assertVisible: "O meni"
- takeScreenshot: screenshots/03_serbian
- tapOn: "Kontakt"
- extendedWaitUntil:
    visible: "Imate proizvod koji mora biti .*"
    timeout: 15000
- tapOn: "Switch language"
- extendedWaitUntil:
    visible: "Have a product that needs to be rock-solid\\?"
    timeout: 10000
