appId: ${BROWSER}
name: Copy email button shows confirmation
tags:
  - contact
env:
  BROWSER: ${BROWSER || 'com.android.chrome'}
  URL: ${URL || 'https://markolosic.github.io'}
---
- runFlow:
    file: subflows/open_site.yaml
    env:
      BROWSER: ${BROWSER}
      URL: ${URL}
- tapOn: "Menu"
- tapOn: "Contact"
- extendedWaitUntil:
    visible: "Have a product that needs to be rock-solid\\?"
    timeout: 15000
- scrollUntilVisible:
    element: ".*Copy email.*"
    direction: DOWN
    timeout: 20000
- tapOn: ".*Copy email.*"
- extendedWaitUntil:
    visible: ".*Copied.*"
    timeout: 5000
- scrollUntilVisible:
    element: ".*markolosic1993@gmail.com.*"
    direction: DOWN
    timeout: 20000
- takeScreenshot: screenshots/04_copied
