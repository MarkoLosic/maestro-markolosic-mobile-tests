# Opens markolosic.github.io in the mobile browser
# (Chrome on Android, Safari on iOS) and dismisses first-run dialogs.
appId: ${BROWSER}
---
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          clearState: true
      # Chrome first-run screens. On a slow emulator they can take >7s to show,
      # and opening the link before they appear leaves Chrome on a blank page,
      # so wait for each one instead of only checking whether it is visible
      - extendedWaitUntil:
          visible: "Use without an account"
          timeout: 30000
          optional: true
      - runFlow:
          when:
            visible: "Use without an account"
          commands:
            - tapOn: "Use without an account"
      - extendedWaitUntil:
          visible: "No thanks"
          timeout: 15000
          optional: true
      - runFlow:
          when:
            visible: "No thanks"
          commands:
            - tapOn: "No thanks"
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          stopApp: true
- openLink: ${URL}
# Safari "new menu" tip (iOS)
- runFlow:
    when:
      visible: "dismiss pop-up"
    commands:
      - tapOn: "dismiss pop-up"
- extendedWaitUntil:
    visible: "Switch language"
    timeout: 30000
# The site remembers the language in localStorage; always start in English
- runFlow:
    when:
      visible: "O meni"
    commands:
      - tapOn: "Switch language"
      - extendedWaitUntil:
          visible: "About"
          timeout: 10000
