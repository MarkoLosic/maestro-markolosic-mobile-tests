appId: ${BROWSER}
name: Blog page lists posts
tags:
  - blog
env:
  BROWSER: ${BROWSER || 'com.android.chrome'}
  URL: ${URL || 'https://markolosic.github.io'}
---
- runFlow:
    file: subflows/open_site.yaml
    env:
      BROWSER: ${BROWSER}
      URL: ${URL}
- tapOn: "Menu"
- tapOn: "Blog"
- extendedWaitUntil:
    visible: "Notes from the test bench."
    timeout: 15000
- assertVisible: "Filter by tag"
- assertVisible: "When Your Page Object Model Stops Scaling: Flow Model and Screenplay Pattern Compared"
- assertVisible: "Testing Across Daylight Saving Time: The Booking Bugs That Only Show Up Twice a Year"
- takeScreenshot: screenshots/05_blog
